<!-- Full-screen login page (no shell) -->
<ng-container *ngIf="isLoginPage$ | async; else appShell">
  <router-outlet></router-outlet>
</ng-container>

<!-- Normal app shell for all other pages -->
<ng-template #appShell>
  <mat-sidenav-container class="app-shell">
    <mat-sidenav #drawer [mode]="(isHandset$ | async) ? 'over' : 'side'" 
      [opened]="(isHandset$ | async) === false && (isFullWidthPage$ | async) === false"
      class="app-sidenav">
      <div class="sidenav-wrapper">
        <div class="sidenav-header" routerLink="/products" style="cursor: pointer;">
          <mat-icon class="brand-icon">storefront</mat-icon>
          <span class="brand-text">{{ 'SIDEBAR.BRAND' | translate }}</span>
        </div>
        <div class="sidenav-main">
          <app-product-category-menu></app-product-category-menu>
        </div>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="app-toolbar">
        <button mat-icon-button type="button" class="menu-btn" (click)="drawer.toggle()" *ngIf="isHandset$ | async"
          [matTooltip]="'SIDEBAR.CATEGORIES' | translate" aria-label="Open categories menu">
          <mat-icon>menu</mat-icon>
        </button>

        <!-- Logo for non-handset (optional, but requested implicitly by 'icons everywhere') -->
        <app-search class="toolbar-search" *ngIf="!(isFullWidthPage$ | async)"></app-search>
        
        <div class="toolbar-brand-clickable" *ngIf="isFullWidthPage$ | async" routerLink="/products" 
          [matTooltip]="'CART.CONTINUE_SHOPPING' | translate" [matTooltipShowDelay]="500">
          <mat-icon class="brand-icon">storefront</mat-icon>
          <span class="brand-text" *ngIf="!(isHandset$ | async)">{{ 'SIDEBAR.BRAND' | translate }}</span>
        </div>
        
        <span class="toolbar-spacer"></span>

        <div class="toolbar-actions">
          <app-cart-status [matTooltip]="'TOOLBAR.VIEW_CART' | translate" [matTooltipShowDelay]="500"></app-cart-status>

          <!-- Language toggle -->
          <button mat-button type="button" (click)="switchLanguage()"
            [matTooltip]="'TOOLBAR.LANGUAGE' | translate"
            [matTooltipShowDelay]="1000"
            class="lang-toggle-btn">
            <span class="lang-label">{{ currentLang === 'tr' ? 'EN' : 'TR' }}</span>
          </button>

          <button mat-icon-button type="button" (click)="toggleTheme()"
            [matTooltip]="(themeService.dark$ | async) ? ('TOOLBAR.LIGHT_MODE' | translate) : ('TOOLBAR.DARK_MODE' | translate)"
            [matTooltipShowDelay]="1000"
            class="theme-toggle-btn">
            <mat-icon>{{ (themeService.dark$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
          </button>

          <ng-container *ngIf="authService.isLoggedIn$ | async; else loginBtnTpl">
            <button mat-icon-button type="button" routerLink="/settings" class="user-btn" 
              [matTooltip]="'TOOLBAR.ACCOUNT' | translate"
              [matTooltipShowDelay]="2000"
              aria-label="User settings">
              <mat-icon>account_circle</mat-icon>
            </button>
            <button mat-icon-button type="button" (click)="logout()" class="logout-btn"
              [matTooltip]="'TOOLBAR.LOGOUT' | translate" [matTooltipShowDelay]="1000" aria-label="Log out">
              <mat-icon>logout</mat-icon>
            </button>
          </ng-container>

          <ng-template #loginBtnTpl>
            <button mat-icon-button type="button" routerLink="/login" 
              [matTooltip]="'TOOLBAR.LOGIN' | translate" [matTooltipShowDelay]="1000" aria-label="Log in" class="login-btn">
              <mat-icon>login</mat-icon>
            </button>
          </ng-template>
        </div>
      </mat-toolbar>

      <main class="router-outlet-wrap">
        <router-outlet></router-outlet>
      </main>

      <footer class="app-footer">
        <div class="footer-inner">
          <span class="footer-brand">{{ 'FOOTER.COPYRIGHT' | translate }}</span>
          <div class="footer-links">
            <a mat-button href="#">{{ 'FOOTER.ABOUT' | translate }}</a>
            <a mat-button href="#">{{ 'FOOTER.CONTACT' | translate }}</a>
            <a mat-button href="#">{{ 'FOOTER.HELP' | translate }}</a>
          </div>
        </div>
      </footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-template>
