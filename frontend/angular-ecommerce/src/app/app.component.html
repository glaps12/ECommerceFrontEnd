<!-- Full-screen login page (no shell) -->
<ng-container *ngIf="isLoginPage$ | async; else appShell">
  <router-outlet></router-outlet>
</ng-container>

<!-- Normal app shell for all other pages -->
<ng-template #appShell>
  <mat-sidenav-container class="app-shell">
    <mat-sidenav
      #drawer
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false"
      class="app-sidenav">
      <div class="sidenav-header">
        <mat-icon class="brand-icon">storefront</mat-icon>
        <span class="brand-text">BrookyShop</span>
      </div>
      <app-product-category-menu></app-product-category-menu>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar class="app-toolbar">
        <button
          mat-icon-button
          type="button"
          class="menu-btn"
          (click)="drawer.toggle()"
          *ngIf="isHandset$ | async"
          aria-label="Open categories menu">
          <mat-icon>menu</mat-icon>
        </button>
        <app-search class="toolbar-search"></app-search>
        <span class="toolbar-spacer"></span>
        <app-cart-status></app-cart-status>

        <!-- Login / User Button -->
        <ng-container *ngIf="authService.isLoggedIn$ | async; else loginBtnTpl">
          <button
            mat-icon-button
            type="button"
            [matMenuTriggerFor]="userMenu"
            class="user-btn"
            aria-label="User menu">
            <mat-icon>account_circle</mat-icon>
          </button>
          <mat-menu #userMenu="matMenu">
            <div class="user-menu-header" mat-menu-item disabled>
              <mat-icon>person</mat-icon>
              <span>{{ authService.userName$ | async }}</span>
            </div>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Log Out</span>
            </button>
          </mat-menu>
        </ng-container>
        <ng-template #loginBtnTpl>
          <button
            mat-icon-button
            type="button"
            routerLink="/login"
            aria-label="Log in"
            class="login-btn">
            <mat-icon>login</mat-icon>
          </button>
        </ng-template>

        <button
          mat-icon-button
          type="button"
          (click)="toggleTheme()"
          [attr.aria-label]="(themeService.dark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'"
          class="theme-toggle-btn">
          <mat-icon>{{ (themeService.dark$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </mat-toolbar>

      <main class="router-outlet-wrap">
        <router-outlet></router-outlet>
      </main>

      <footer class="app-footer">
        <div class="footer-inner">
          <span class="footer-brand">© 2026 BrookyShop</span>
          <div class="footer-links">
            <a mat-button href="#">About Us</a>
            <a mat-button href="#">Contact</a>
            <a mat-button href="#">Help</a>
          </div>
        </div>
      </footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-template>
