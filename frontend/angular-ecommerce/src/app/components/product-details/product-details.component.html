<ng-container *ngIf="product as p">
  <mat-card class="detail-card" appearance="outlined">
    <div class="detail-grid">
      <div class="detail-image-wrap">
        <div class="detail-image-container">
          <img [src]="p.imageUrl" [alt]="p.name" class="detail-image" />
        </div>
      </div>
      <div class="detail-body">
        <h1 class="detail-title">{{ p.name }}</h1>
        <p class="detail-sku">SKU: {{ p.sku }}</p>
        <p class="detail-price">{{ p.unitPrice | currency: "USD" }}</p>

        <div class="detail-stock" *ngIf="p.unitsInStock > 0">
          <mat-icon class="stock-icon">check_circle</mat-icon>
          <span>In Stock ({{ p.unitsInStock }} available)</span>
        </div>
        <div class="detail-stock out" *ngIf="p.unitsInStock === 0">
          <mat-icon class="stock-icon">cancel</mat-icon>
          <span>Out of Stock</span>
        </div>

        <button mat-flat-button color="primary" type="button" (click)="addToCart(p)" class="detail-add-btn">
          <mat-icon>add_shopping_cart</mat-icon>
          Add to cart
        </button>

        <mat-divider class="detail-divider"></mat-divider>

        <h3 class="detail-subhead">Description</h3>
        <p class="detail-desc">{{ p.description }}</p>

        <button mat-stroked-button type="button" routerLink="/products" class="back-btn">
          <mat-icon>arrow_back</mat-icon>
          Back to product list
        </button>
      </div>
    </div>
  </mat-card>
</ng-container>
