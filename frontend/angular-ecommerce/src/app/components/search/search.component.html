<div class="search-capsule">
  <mat-icon class="search-icon">search</mat-icon>
  <input
    class="search-input"
    type="text"
    [placeholder]="'TOOLBAR.SEARCH_PLACEHOLDER' | translate"
    #q
    (keyup.enter)="doSearch(q.value)" />
    @if (q.value) {
      <button
        mat-icon-button
        type="button"
        class="clear-btn"
        (click)="q.value = ''"
        aria-label="Clear search">
        <mat-icon>close</mat-icon>
      </button>
    }
  </div>
