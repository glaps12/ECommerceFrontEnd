<div class="product-list-page">
  <div class="product-grid">
    <div *ngFor="let p of products" class="product-card-wrap">
      <mat-card class="product-card" appearance="outlined">
        <a [routerLink]="['/products', p.id]" class="card-image-link">
          <div class="card-image-container">
            <img [src]="p.imageUrl" [alt]="p.name" loading="lazy" class="card-image" />
          </div>
        </a>
        <mat-card-content class="card-body">
          <a [routerLink]="['/products', p.id]" class="card-title-link">
            <h3 class="card-title">{{ p.name }}</h3>
          </a>
          <div class="card-meta">
            <span class="card-price">{{ p.unitPrice | currency: "USD" }}</span>
            <span class="card-stock" *ngIf="p.unitsInStock > 0">In Stock</span>
            <span class="card-stock out" *ngIf="p.unitsInStock === 0">Out of Stock</span>
          </div>
        </mat-card-content>
        <mat-card-actions class="card-actions">
          <button mat-flat-button color="primary" type="button" (click)="addToCart(p)" class="add-cart-btn">
            <mat-icon>add_shopping_cart</mat-icon>
            Add to cart
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>

  <p *ngIf="products.length === 0" class="empty-hint" role="status">
    <mat-icon class="empty-icon">inventory_2</mat-icon>
    No products found.
  </p>

  <!-- Custom pagination bar (avoids CDK overlay issues with mat-paginator select) -->
  <div class="custom-paginator" *ngIf="theTotalElements > 0">
    <div class="page-size-group">
      <span class="page-size-label">Show:</span>
      <button
        *ngFor="let size of [5, 10, 15, 20, 50]"
        mat-button
        type="button"
        class="page-size-btn"
        [class.active]="thePageSize === size"
        (click)="onPageSizeChange(size)">
        {{ size }}
      </button>
    </div>

    <span class="page-info">
      {{ (thePageNumber - 1) * thePageSize + 1 }}–{{ thePageNumber * thePageSize > theTotalElements ? theTotalElements : thePageNumber * thePageSize }}
      of {{ theTotalElements }}
    </span>

    <div class="page-nav-group">
      <button mat-icon-button type="button" [disabled]="thePageNumber === 1" (click)="goToPage(1)" aria-label="First page">
        <mat-icon>first_page</mat-icon>
      </button>
      <button mat-icon-button type="button" [disabled]="thePageNumber === 1" (click)="goToPage(thePageNumber - 1)" aria-label="Previous page">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-icon-button type="button" [disabled]="thePageNumber * thePageSize >= theTotalElements" (click)="goToPage(thePageNumber + 1)" aria-label="Next page">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button mat-icon-button type="button" [disabled]="thePageNumber * thePageSize >= theTotalElements" (click)="goToPage(lastPage)" aria-label="Last page">
        <mat-icon>last_page</mat-icon>
      </button>
    </div>
  </div>
</div>
